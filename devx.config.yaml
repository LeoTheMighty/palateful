# devx.config.yaml — generated by /devx-init at 2026-07-27T16:00:07.362Z
# Strategic axes: mode=YOLO, project.shape=mature-refactor-and-add, thoroughness=send-it

# Reference: docs/CONFIG.md (canonical knob list), docs/MODES.md
# (mode → subsystem behavior matrix), docs/DESIGN.md §Project shapes.

# Re-run `/devx-init` to upgrade in place. Hand-edits are preserved
# outside the strategic axes; the axes themselves are diff'd against the
# running mode and surfaced as a halt-and-confirm in upgrade mode.

devx_version: 0.1.0+9070cd3
mode: YOLO # asked: N7
project:
  shape: mature-refactor-and-add # asked: N6
thoroughness: send-it
capacity:
  max_concurrent: 5
  usage_cap_pct: 95
  usage_hard_stop_pct: 100
  token_budget_per_spec: 500000
  model_strategy: balanced
permissions:
  bash:
    allow:
      - git
      - gh
      - npm
      - pnpm
      - yarn
      - pip
      - pytest
      - cargo
      - go
      - dart
      - flutter
    ask:
      - terraform
      - kubectl
      - docker
      - aws
      - gcloud
      - az
      - ssh
      - rsync
    deny:
      - rm -rf /
      - curl https://*
      - sudo *
  file_writes:
    allow:
      - "**/*"
    deny:
      - .env
      - .env.*
      - secrets/**
      - id_rsa*
      - "**/.aws/credentials"
      - "**/.ssh/**"
git:
  default_branch: main
  integration_branch: null # asked: N8
  branch_prefix: feat/
  pr_strategy: pr-to-main
  merge_method: squash
  protect_main: false
  require_linear_history: true
  allow_force_push_main: false
  allow_force_push_develop: false
  delete_branch_on_merge: true
promotion:
  gate: fast-ship-always
  soak_hours: 0
  required_checks:
    - ci
  block_on_new_debug_items: false
  autonomy:
    initial_n: 0 # asked: N9
    count: 0
    rollback_penalty: 0.5
    hotfix_zeroes: true
    veto_window_hours: 24
  agent: PromotionAgent
coverage:
  enabled: true
  target: touched-lines
  threshold: 1
  blocking: false
  opt_out_marker: devx:no-coverage
  flaky_window_hours: 24
  flaky_action: file-test-md-entry
ci:
  provider: github-actions # inferred: .github/workflows/* present — ci.provider=github-actions
  workflow_path: .github/workflows/devx-ci.yml
  required_checks:
    - lint
    - test
  retry_on_flake: true
  max_retries: 2
  poll_interval_s: 30
  poll_timeout_min: 45
projects:
  # Runner table locked at browser-qa-agent RED (plan.md §RED-stage
  # prerequisites). `devx gate evals` resolves artifacts by longest path
  # prefix; command = `<test> <artifact-relative-to-path>` with cwd = path.
  # Mutually exclusive with a `stack:` block per cfg203 (none present).
  - name: api
    path: services/api
    test: poetry run pytest
  - name: app
    path: app
    test: flutter test
  - name: e2e
    path: services/e2e
    test: bash scripts/e2e_lifecycle.sh # lifecycle wrapper (Phase 2), not bare run_all.sh
  - name: workstream-evals
    path: _devx/workstreams
    test: bash run-eval.sh # dispatcher: no args → skip 0; one arg → exec bash "$1"
qa:
  # browser-qa-agent Phase 1 (bqa101): interim-truthful values. The previous
  # pair named a browser driver installed nowhere in this repo.
  # `browser_harness` is the constrained upstream enum, so `none` is the
  # honest legal value until bqa103 extends that enum; the final driver value
  # lands here in bqa105. `scripted_test_runner` is a free string, and
  # flutter drive is what the gen-2 e2e harness actually invokes
  # (services/e2e/scripts/run_all.sh:62).
  # E-1 asserts by grep that this file names no uninstalled driver — keep
  # driver names out of prose here, in either direction.
  browser_harness: none
  layer_2_cadence: on-demand
  layer_2_personas: 4
  scripted_test_runner: flutter-drive
focus_group:
  panel_size: 5
  consult_at: []
  auto_evolve: true
  binding: false
self_healing:
  enabled: true
  retro_concordance_threshold: 5
  auto_apply:
    confidence_min: 0.85
    blast_radius_max: medium
  canary_runs: 3
  user_review_required_for:
    - skills
    - prompts
    - agents
  user_review_optional_for:
    - memory
    - claude-md
    - config
  over_tuning_detector: true
  weekly_window_days: 7
notifications:
  channels: []
  events:
    context_rot_detected: silent
    manual_filed: push
    interview_filed: push
    ci_failed: digest
    pr_opened: silent
    pr_merged: digest
    promotion_ready: silent
    heartbeat_stale: push
    usage_cap_hit: push
    agent_crashed_repeatedly: push
  quiet_hours: 22:00-08:00 # asked: N13
  quiet_hours_override:
    - usage_cap_hit
  digest_schedule: daily-09:00
ui:
  tui:
    enabled: true
    layout: three-pane
    theme: dark
    keybinds: vim
  web:
    enabled: true
    port: 7321
    bind: 127.0.0.1
    theme: dark
  mobile:
    enabled: true
    activity_feed_depth: 50
    swipe_to_kill: true
manager:
  heartbeat_interval_s: 60
  restart_on_token_pct: 0.85
  max_worker_age_min: 90
  worker_crash_backoff_s:
    - 10
    - 30
    - 90
    - 300
  max_restarts_per_spec: 5
  cloud_watchdog: true
  os_supervisor: auto
concierge:
  always_on: true
  context_window_target: 0.4
  digest_interval_min: 60
  intent_routing:
    feature_request: DEV.md
    bug_report: DEBUG.md
    question: INTERVIEW.md
    feedback: FOCUS.md
storage:
  worktree_root: .worktrees
  cache_dir: .devx-cache
  log_retention_days: 14
  spec_archive_after_days: 90
  archive_path: archive/
  gitignore_managed: true
observability:
  log_level: info
  redact:
    - api_keys
    - emails
    - tokens
    - aws_access_keys
  telemetry:
    enabled: false
    endpoint: null
    anonymized: true
engine:
  workstreams_root: _devx/workstreams
  archive_root: _devx/archive
  code_citation_hints: []
  expectations_min: 3
  prose_budget_kb: 60
  critique:
    lenses:
      - pm
      - architect
      - dev
      - qa
    min_surfaces: 2
loop:
  max_iterations_per_item: 8
  max_tokens_per_item: 2000000
  max_consecutive_failures: 3
  max_items: 10
  max_total_tokens: 10000000
  backoff_ms:
    - 60000
    - 120000
    - 240000
