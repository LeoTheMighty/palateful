  # === Performance Health v2 (3 epics) — added 2026-04-23 ===
  # Motivation: user spotted a steady stream of repeated GETs in Chrome
  # DevTools on Flutter web (notably /v1/import-items). Phase-2 audit found
  # ~8 concrete frontend fetch wins beyond what epic-perf-flutter-client-
  # polish closed (2026-04-21), plus a gap in client-side observability
  # (we measure server-side p95 but nothing route-paint / cold-start /
  # frame-jank / OS-level hang on the client). Three parallel epics:
  # fetch minimization (additive backend ?include= + ?job_ids, no new
  # endpoints on the hot path), client analytics (new client_latencies
  # table + Postgres-backed pipeline mirroring obs-latency + Firebase
  # Performance as secondary + iOS MetricKit + Android JankStats + web
  # Navigation Timing), and debug tooling (in-app debug overlay + bin/
  # perf-audit Patrol harness + committed budget YAML + CI regression
  # guard + analyze_latency.py --regression-hunt --section client|all).
  #
  # User-locked decisions (2026-04-23):
  #   - Three-epic split, parallelizable
  #   - Custom /v1/client-latencies primary + Firebase Performance secondary
  #   - MetricKit (iOS) + JankStats (Android) both wired now
