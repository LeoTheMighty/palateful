  # === API Async SQLAlchemy Migration — added 2026-04-23 ===
  # Motivation: evidence on 2026-04-23 from analyze_latency.py + cla-1a
  # client_latencies shows GET /v1/meals/{id} with server-side p95 188ms
  # but client-side p95 5192ms; POST /v1/users/me/client-errors p95
  # 5931ms. Root cause: every router handler is `async def` but calls
  # synchronous Endpoint.call(...) inline, blocking the event loop on
  # every request's DB queries. Migrates services/api to async
  # SQLAlchemy + async handlers + async-native SDKs. Worker + parser +
  # migrator stay sync. Ops scripts + bin/prod-script prelude + manage.py
  # REPL stay sync (permanent dual surface).
  #
  # User-locked decisions (2026-04-23):
  #   - Scope: services/api only; worker/parser/migrator untouched
  #   - Dual Database + Endpoint surface; sync stays for scripts/writers
  #   - Big-bang cutover (no canary infra exists); revert-commit rollback
  #   - OpenAI → AsyncOpenAI; Firebase Admin + boto3 → run_in_threadpool
  #   - 100% API coverage gate stays on throughout; no temporary exemptions
  #   - Per-router incremental rollout (mix of sync + async in prod mid-migration)
  # No Terraform changes; one new pip dep (asyncpg); two new env vars.
  # No Flutter changes; response shapes byte-identical.

  epic-api-async-migration: backlog
  # Phase 1 — Foundations
  aam-1-async-engine-and-rds-capacity: done
  aam-2-async-database-class-and-worker-contract-gate: done
