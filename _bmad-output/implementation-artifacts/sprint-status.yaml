  # new guardrails module with audit logging (log_inferred_field_clamp + AST-
  # lint), penalizes confidence 0.05 × min(inferred_count, 5) (cap 0.25), and
  # surfaces the provenance end-to-end via a new recipes.inferred_fields JSONB
  # column + UpdateRecipe shrink-only validation. Flutter InferredFieldBadge
  # (Icons.auto_awesome, 14pt, tertiary tint) renders next to each inferable
  # field label on Review Import + Recipe Edit; badge dismisses on first edit;
  # Review Import dispatches POST /v1/import-items/{id}/corrections (writes
  # error_logs row service="audit" error_type="InferredFieldCorrected"). Recipe
  # Edit dispatch deferred to future consolidated dashboard; UpdateRecipe round-
  # trip carries shrunken inferred_fields. New eval metrics field_inference_
  # accuracy + hallucination_rate (anti-metric) as soft gates. Feature flag
