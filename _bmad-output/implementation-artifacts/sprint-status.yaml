  # Ships analyze_latency.py ops script (with regression-hunt CTE), enables
  # RDS Performance Insights + slow-query log + tuned parameter group
  # (shared_buffers=256MB, work_mem=8MB, effective_cache_size=1500MB,
  # log_min_duration_statement=100, max_connections=60), upgrades RDS
  # t4g.micro → t4g.small (~+$10/mo), bumps API ECS task 256/512 → 512/1024
  # (~+$5/mo), tunes ALB health check (30s/5s → 60s/3s), adds
  # cache.t4g.micro ElastiCache for Auth0 JWKS cache (~+$1/mo, fail-open
  # to in-memory on Redis unreachable), bumps DB_POOL_SIZE/MAX_OVERFLOW
  # 10/20 → 20/40, audits pre-20260420 migrations for non-CONCURRENTLY
  # CREATE INDEX and backports as forward migrations. No API shape changes.
  # Blocks nothing hard; pim-1 (script) unblocks QA walkthroughs for the
  # other two perf epics.
