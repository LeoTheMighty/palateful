  # landed. Phase-2 research converged on four contributors: infra floor
  # (t4g.micro burst exhaustion, untuned PG params, 256 CPU API task, cold
  # JWKS), backend N+1 / redundant queries on ~8 list endpoints, redundant
  # Flutter activity double-poll (shell + tabs), and Auth0 JWKS cold-starts.
  # User answers (2026-04-21): all infra changes in scope (+$15/mo, under
  # NFR29 $50 cap); retune only redundant polls (imports 2s + admin logs 5s
  # preserved). No API contract changes; no breaking changes; every story
  # captures p50/p95 before/after from analyze_latency.py in its QA walkthrough.

