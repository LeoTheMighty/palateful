[tool.coverage.run]
branch = true
source = [ "migrations" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
# Report paths (xml/html/junit) are pinned by the nx `test` target, not here:
# the target runs from the workspace root, and addopts paths resolve against
# the invocation cwd, so no single relative path is right for every caller.
# `--cov` must not be the last addopt: it takes an optional value and would
# swallow the test path the nx target passes, collecting the whole repo.
addopts = "--cov --cov-report=term"

[tool.poetry]
name = "migrator"
version = "0.1.0"
description = "Database migrations for Palateful"
authors = ["Leonid Belyi"]
package-mode = true

  [[tool.poetry.packages]]
  include = "migrations"

    [tool.poetry.dependencies]
    python = "^3.13"
    alembic = "^1.14"
    sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
    asyncpg = "^0.30"
    pgvector = "^0.4"
    psycopg2-binary = "^2.9"  # Needed for sync Alembic operations
    utils = {path = "../../libraries/utils", develop = true}

[tool.poetry.group.dev.dependencies]
ruff = "^0.11"
pytest = "^8.0"
pytest-cov = "^6.0"
pytest-html = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
