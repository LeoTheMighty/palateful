[tool.poetry]
name = "parser"
version = "0.1.0"
description = "Parser service for Palateful using HunyuanOCR"
authors = ["Leonid Belyi"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.120"
uvicorn = {extras = ["standard"], version = "^0.34"}
torch = "^2.0"
transformers = "^4.40"
accelerate = "^1.0"
pillow = "^11.0"
python-multipart = "^0.0.20"
httpx = "^0.27"
boto3 = "^1.35"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0"
ipykernel = "^6.0"
matplotlib = "^3.8"
ruff = "^0.11"
pytest = "^8.0"
pytest-cov = "^6.0"
pytest-html = "^4.0"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:', 'pragma: no cover']
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report html:'../../coverage/services/parser/html' --cov-report xml:'../../coverage/services/parser/coverage.xml' --html='../../reports/services/parser/unittests/html/index.html' --junitxml='../../reports/services/parser/unittests/junit.xml'"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
