# Recipe Extraction Evaluation Test Cases
# Add test HTML files and their expected JSON outputs here.
#
# Multi-recipe cases (tagged `multi_recipe`) exercise the FR88 fan-out
# contract: the extractor must emit a `recipes` array of the right
# length. Threshold gate: recipe_count_accuracy_avg >= 0.8 on these.

cases:
  - id: multi_recipe_facing_pages
    text: ../../fixtures/text/multi_recipe_facing_pages.txt
    expected: ../../fixtures/expected/multi_recipe_facing_pages.json
    extractor: text
    tags: [multi_recipe, text]

  - id: multi_recipe_side_by_side
    text: ../../fixtures/text/multi_recipe_side_by_side.txt
    expected: ../../fixtures/expected/multi_recipe_side_by_side.json
    extractor: text
    tags: [multi_recipe, text]

  - id: multi_recipe_three_panel
    text: ../../fixtures/text/multi_recipe_three_panel.txt
    expected: ../../fixtures/expected/multi_recipe_three_panel.json
    extractor: text
    tags: [multi_recipe, text]

config:
  timeout_seconds: 120
  skip_tags: []
