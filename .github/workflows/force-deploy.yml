# Force Deploy — manual-trigger production deploy that rebuilds ALL images
# with the current HEAD SHA, applies terraform with those tags, runs the
# migrator, then force-deploys the ECS services. Bypasses NX affected
# detection (use this when you need to redeploy without a code change —
# secret rotation, recover from a broken deploy, re-run migrations).
#
# Trigger: Actions → "Force Deploy" → Run workflow. You can pick any branch
# in the ref dropdown; the workflow uses that ref's HEAD SHA as the image
# tag, so deploying from a branch is supported for hotfix scenarios.
#
# Every deploy-touching job sets environment: production, so GitHub's
# required-reviewer approval gate applies to each one — nothing reaches
# AWS without human approval.

name: Force Deploy

on:
  workflow_dispatch:

# Share the production-deploy concurrency lane with CI so a force-deploy
# and a main-push deploy can't run at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  AWS_REGION: us-east-1
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

jobs:
  deploy-images:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ECR_ACCOUNT_URL: ${{ secrets.AWS_ECR_ACCOUNT_URL }}
      IMAGE_TAG: ${{ github.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        run: npx nx run api:build:ci
        env:
          INPUT_PUSH: 'true'

      - name: Build and push Migrator
        run: npx nx run migrator:build:ci
        env:
          INPUT_PUSH: 'true'

      - name: Build and push Worker
        run: npx nx run worker:build:ci
        env:
          INPUT_PUSH: 'true'

      - name: Build and push Parser
        run: npx nx run parser:build:ci
        env:
          INPUT_PUSH: 'true'

  terraform-prod:
    runs-on: ubuntu-latest
    needs: deploy-images
    environment: production
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Create TF plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init (prod)
        run: terraform init -backend-config=../../backend-prod.hcl
        working-directory: terraform/environments/prod

      - name: Terraform plan (prod)
        run: |
          terraform plan -no-color -input=false \
            -var "api_image_tag=$IMAGE_TAG" \
            -var "worker_image_tag=$IMAGE_TAG" \
            -var "migrator_image_tag=$IMAGE_TAG" \
            -var "parser_image_tag=$IMAGE_TAG"
        working-directory: terraform/environments/prod

      - name: Terraform apply (prod)
        run: |
          terraform apply -auto-approve -input=false \
            -var "api_image_tag=$IMAGE_TAG" \
            -var "worker_image_tag=$IMAGE_TAG" \
            -var "migrator_image_tag=$IMAGE_TAG" \
            -var "parser_image_tag=$IMAGE_TAG"
        working-directory: terraform/environments/prod

  run-migrator:
    runs-on: ubuntu-latest
    needs: terraform-prod
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Create TF plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Terraform outputs
        id: tf
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend-config=../../backend-prod.hcl
          echo "subnets=$(terraform output -json public_subnet_ids | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "sg=$(terraform output -raw ecs_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"

      - name: Run migrator task
        id: migrator
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ steps.tf.outputs.cluster }} \
            --task-definition palateful-migrator-prod \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.tf.outputs.subnets }}],securityGroups=[${{ steps.tf.outputs.sg }}],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Migrator task started: $TASK_ARN"

      - name: Wait for migrator to complete
        run: |
          aws ecs wait tasks-stopped \
            --cluster ${{ steps.tf.outputs.cluster }} \
            --tasks ${{ steps.migrator.outputs.task_arn }}
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ steps.tf.outputs.cluster }} \
            --tasks ${{ steps.migrator.outputs.task_arn }} \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migrator failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Migrator completed successfully"

  deploy-services:
    runs-on: ubuntu-latest
    needs: [run-migrator, terraform-prod, deploy-images]
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment - API
        run: |
          aws ecs update-service --cluster palateful-prod --service palateful-api-prod --force-new-deployment
          echo "API deployment triggered"

      - name: Force new deployment - Worker
        run: |
          aws ecs update-service --cluster palateful-prod --service palateful-worker-prod --force-new-deployment
          echo "Worker deployment triggered"
