# Deploy-freshness check — fails when prod runs an image more than 7 days
# behind main, so a silent deploy freeze (92 days, once) cannot recur.
#
# This lives in its OWN workflow file on purpose. The check shares its fate
# with the CI system whose silent breakage it exists to catch; the only
# mitigation is a separate file with its own schedule trigger, so a red
# ci.yml cannot skip it. A push-triggered job inside ci.yml would have been
# skipped throughout the very incident that motivated this check.
name: deploy-freshness

on:
  schedule:
    # Two slots, 12h apart, deliberately NOT one daily check.
    #
    # E-7's threshold is "gap reported within 24h of crossing 7 days". A
    # single daily cron has *zero* margin against that even in theory, and
    # GitHub's scheduler does not fire when asked. Measured over this
    # workflow's own first 50 firings (2026-08-01..2026-09-19):
    #
    #   - intervals ranged 18.3h to 31.9h, and
    #   - **25 of 49 intervals exceeded 24h** — the breach was routine,
    #     not an outlier. Half of all firings arrived late enough that a
    #     gap crossing the 7-day line would have been reported outside
    #     the window E-7 promises.
    #
    # Firing times normally land 15:27Z-20:44Z (drift up to 5.7h past the
    # declared 15:00Z), with one excursion on 2026-08-28 to 00:19Z and
    # 23:58Z. The 31.9h worst case comes from that drift accumulating in
    # one direction across a day boundary, not from a single late run.
    #
    # Two slots 12h apart absorb it: the nominal wait halves to 12h, so
    # even 5.7h of routine drift (and the observed one-off excursion)
    # stays inside 24h. Leo's call was to tighten the schedule rather
    # than loosen E-7's assertion.
    # 15:00 UTC == 09:00 MDT (the original morning slot).
    - cron: '0 15 * * *'
    # 03:00 UTC == 21:00 MDT.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      synthetic-gap-days:
        description: >-
          TEST ONLY: substitute this gap (in days) for the real measurement.
          Used by E-7 observation steps 3-4 to prove both the fail and pass
          paths without touching prod.
        required: false
        default: ''

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER: palateful-prod
  SERVICE: palateful-api-prod
  MAX_GAP_DAYS: 7
  # The alert topic from alrt1 (terraform/modules/alerts). Subscriptions are
  # created by hand, outside Terraform, so no address appears in this repo,
  # in plan output, or in state — CI logs here are public.
  TOPIC_NAME: palateful-prod-alerts

jobs:
  check-freshness:
    # `environment: production` is required: the AWS secrets exist ONLY as
    # environment-scoped secrets (first dispatch run 30647079681 failed with
    # "Credentials could not be loaded" without it). Verified 2026-07-31 via
    # the API that this environment has NO protection rules — no reviewer
    # gate, no branch policy — so the scheduled run still fires unattended.
    # E-7 step 6 re-verifies that every morning; if a required-reviewer rule
    # is ever added to the environment, this check stalls waiting for
    # approval and can no longer detect an *unattended* freeze — either
    # exempt this job or move the AWS secrets to repo scope.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the deployed SHA may be months old (92 days when
          # this workstream opened) — a shallow clone cannot date it.
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Measure gap between running image and its commit date
        id: measure
        env:
          SYNTHETIC_GAP_DAYS: ${{ inputs.synthetic-gap-days }}
        run: |
          set -euo pipefail

          # A VERDICT IS NOT THE SAME AS A FAILURE (G3, dfrcp1).
          #
          # This step still exits non-zero on a red verdict — `tools/
          # deploy-freshness-self-test.sh` extracts this body and asserts
          # exactly that, and the exit code IS the check. What's new is
          # that it RECORDS the verdict first, so the notify step below
          # (which runs on `always()`, because this step has failed by
          # then) can tell the two failure shapes apart:
          #
          #   verdict=stale   — measured prod, it is too old. Notify.
          #   verdict=unknown — measured prod, the tag isn't a commit here.
          #                     Notify; unknown provenance is alarming.
          #   verdict=fresh   — measured prod, it is current. Silence.
          #   (no verdict)    — this step never got to a measurement. The
          #                     49 runs before 2026-09-20 all died in
          #                     configure-aws-credentials and measured
          #                     NOTHING, while looking exactly as red as a
          #                     real freeze. See the header note.
          #
          # The no-verdict case cannot notify from here: it means AWS
          # credentials failed, and publishing to SNS needs those same
          # credentials. Nothing this workflow can do reaches a human in
          # that state — that gap is absal1's job (alert on the ABSENCE of
          # an expected heartbeat), and it is the reason absal1 must land.
          # Do not "fix" this by making the notify step run without a
          # verdict; it would publish nothing and hide the gap.

          # `tools/deploy-freshness-self-test.sh` extracts this step's body
          # and runs it OUTSIDE Actions, where $GITHUB_OUTPUT does not exist
          # and `set -u` turns a bare reference into a fatal error. Writing
          # through this helper keeps the step runnable in both places — and
          # keeps the self-test able to check the logic, which is the whole
          # reason that harness exists.
          emit() { printf '%s\n' "$@" >> "${GITHUB_OUTPUT:-/dev/null}"; }

          # THE FAMILY-SHORTCUT TRAP — do not "simplify" this to
          #   aws ecs describe-task-definition --task-definition palateful-api-prod
          # The family-name shortcut resolves to the family's newest ACTIVE
          # revision, i.e. what was most recently REGISTERED — not what ECS
          # is RUNNING. deploy-services (ci.yml) uses the shortcut correctly
          # because it runs immediately after terraform-prod writes that
          # revision; this check asks the opposite question. With the
          # shortcut, registering a new revision without deploying it would
          # make a frozen prod look fresh — the check would be green and
          # blind, masking exactly the failure it exists to catch. So:
          # describe-services -> services[0].taskDefinition (the revision
          # ARN actually in service) -> describe-task-definition on that ARN.
          running_td=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          echo "Running task definition: $running_td"

          image=$(aws ecs describe-task-definition --task-definition "$running_td" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          tag="${image##*:}"
          echo "Deployed image: $image"

          if [ -n "${SYNTHETIC_GAP_DAYS:-}" ]; then
            gap_days="$SYNTHETIC_GAP_DAYS"
            echo "::warning::SYNTHETIC gap of ${gap_days}d substituted for the real measurement (test run)."
          else
            # Image tags are pinned to the git SHA by resolve-tags (ci.yml),
            # so the tag dates the deployment directly. A tag that is not a
            # commit here means unknown provenance — itself alarming, so fail.
            if ! git cat-file -e "${tag}^{commit}" 2>/dev/null; then
              echo "::error::Deployed tag '$tag' is not a commit in this repository — cannot date the deployment."
              emit "verdict=unknown" \
                   "detail=Deployed tag '${tag}' is not a commit in this repository — cannot date the deployment. Image: ${image}"
              exit 1
            fi
            deployed_ct=$(git log -1 --format=%ct "$tag")
            gap_days=$(( ($(date +%s) - deployed_ct) / 86400 ))
            echo "Deployed commit: $(git log -1 --format='%h %ci %s' "$tag")"
          fi

          echo "Gap: ${gap_days} day(s); threshold: ${MAX_GAP_DAYS} day(s)."
          emit "gap_days=${gap_days}"
          if [ "$gap_days" -gt "$MAX_GAP_DAYS" ]; then
            echo "::error::Prod is running an image ${gap_days} days old (threshold ${MAX_GAP_DAYS}d) — a deploy freeze is in progress. Check ci.yml deploy jobs and the production environment reviewer gate."
            emit "verdict=stale" \
                 "detail=Prod is running an image ${gap_days} days old (threshold ${MAX_GAP_DAYS}d) — a deploy freeze is in progress. Check ci.yml deploy jobs and the production environment reviewer gate."
            exit 1
          fi
          echo "Prod image is fresh (${gap_days}d <= ${MAX_GAP_DAYS}d)."
          emit "verdict=fresh"

      # Publish the verdict BEFORE failing the job, so a red verdict reaches
      # a human instead of sitting in a run nobody opens. Guarded on a
      # verdict actually existing: see the no-verdict note above.
      - name: Notify on a red verdict
        if: always() && (steps.measure.outputs.verdict == 'stale' || steps.measure.outputs.verdict == 'unknown')
        env:
          VERDICT: ${{ steps.measure.outputs.verdict }}
          DETAIL: ${{ steps.measure.outputs.detail }}
        run: |
          set -euo pipefail

          # Look the ARN up by name rather than hardcoding it: the account
          # id is not secret, but it has no business being in a public repo
          # when one API call derives it. Topic: modules/alerts (alrt1).
          topic_arn=$(aws sns list-topics \
            --query "Topics[?ends_with(TopicArn, ':${TOPIC_NAME}')].TopicArn | [0]" \
            --output text)

          if [ -z "$topic_arn" ] || [ "$topic_arn" = "None" ]; then
            echo "::error::Alert topic '${TOPIC_NAME}' not found — the verdict below reached nobody."
            echo "$DETAIL"
            exit 1
          fi

          # Built with printf rather than a literal multi-line string: an
          # unindented continuation line inside `run: |` silently ends the
          # block and breaks the whole workflow file.
          message=$(printf '%s\n\nWorkflow run: %s/%s/actions/runs/%s\n\n%s\n' \
            "$DETAIL" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "This is a measured verdict about prod, not a CI failure: the check reached AWS, read the running task definition, and this is what it found.")

          aws sns publish \
            --topic-arn "$topic_arn" \
            --subject "palateful prod: deploy-freshness ${VERDICT}" \
            --message "$message" > /dev/null

          echo "Published '${VERDICT}' verdict to ${TOPIC_NAME}."

