# Deploy-freshness check — fails when prod is OVERDUE a deploy: when main has
# carried a change that deploys a new image for longer than MAX_OVERDUE_HOURS
# and prod still does not run it. So a silent deploy freeze (92 days, once)
# cannot recur — and a quiet backend is not mistaken for one.
#
# This lives in its OWN workflow file on purpose. The check shares its fate
# with the CI system whose silent breakage it exists to catch; the only
# mitigation is a separate file with its own schedule trigger, so a red
# ci.yml cannot skip it. A push-triggered job inside ci.yml would have been
# skipped throughout the very incident that motivated this check.
#
# ─────────────────────────────────────────────────────────────────────────
# WHAT IT MEASURES, AND WHY NOT IMAGE AGE
#
# Until 2026-11-24 this compared the running image's commit date to `now`
# (red past 7 days). That cannot tell "the deploy pipeline is stuck" from
# "nothing needed deploying", and this project is worked in bursts: the last
# backend burst deployed cd6a3c3e on 2026-09-24, and from 2026-10-03 — seven
# days later — the check failed all 106 of its scheduled firings through
# 2026-11-25, while all 24 commits on main since cd6a3c3e touched nothing
# that deploys. Correct image, permanent alarm: the state in which a monitor
# stops being read.
#
# Now: take D = the commit prod's image was built from, and B = main as it
# stood MAX_OVERDUE_HOURS ago. RED iff tools/deploy-affected.sh says D..B
# deploys a new image — i.e. a change that should have produced a new image
# landed more than the grace window ago, and prod does not have it. That
# script is the same one ci.yml's detect-changes runs to decide what deploys,
# so "should have deployed" here and "deploys" there cannot drift apart.
#
#   quiet backend, any image age   -> D..main deploys nothing     -> green
#   deploy-triggering merge, < grace -> D..B deploys nothing yet   -> green (in flight)
#   deploy-triggering merge, > grace -> D..B deploys something      -> RED
#
# IF THIS CHECK IS RED AND YOU ARE HERE TO FIX IT: it is probably working.
# The alert names the oldest commit that should have deployed and did not.
# Find ci.yml's run for that push (or the push after it) and read
# detect-changes -> deploy-images -> terraform-prod -> deploy-services; then
# the production environment's reviewer gate. Fix the deploy, not the check.
#
# Historical note: this check authenticated for the first time on
# 2026-09-20 (run 35528125176). The 50 scheduled runs before it all died in
# configure-aws-credentials for want of `environment: production`, so it
# had never once measured prod.
# ─────────────────────────────────────────────────────────────────────────
name: deploy-freshness

on:
  schedule:
    # Two slots, 12h apart, deliberately NOT one daily check.
    #
    # E-7's threshold is "gap reported within 24h of crossing 7 days". A
    # single daily cron has *zero* margin against that even in theory, and
    # GitHub's scheduler does not fire when asked. Measured over this
    # workflow's own first 50 firings (2026-08-01..2026-09-19):
    #
    #   - intervals ranged 18.3h to 31.9h, and
    #   - **25 of 49 intervals exceeded 24h** — the breach was routine,
    #     not an outlier. Half of all firings arrived late enough that a
    #     gap crossing the 7-day line would have been reported outside
    #     the window E-7 promises.
    #
    # Firing times normally land 15:27Z-20:44Z (drift up to 5.7h past the
    # declared 15:00Z), with one excursion on 2026-08-28 to 00:19Z and
    # 23:58Z. The 31.9h worst case comes from that drift accumulating in
    # one direction across a day boundary, not from a single late run.
    #
    # Two slots 12h apart absorb it: the nominal wait halves to 12h, so
    # even 5.7h of routine drift (and the observed one-off excursion)
    # stays inside 24h. Leo's call was to tighten the schedule rather
    # than loosen E-7's assertion.
    # 15:00 UTC == 09:00 MDT (the original morning slot).
    - cron: '0 15 * * *'
    # 03:00 UTC == 21:00 MDT.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      # Renamed from synthetic-gap-days (2026-11-24): the measured quantity
      # changed from image age in days to overdue time in hours, and a
      # dispatch still passing the old name fails at `gh workflow run`
      # ("unexpected inputs") instead of silently measuring something else.
      synthetic-overdue-hours:
        description: >-
          TEST ONLY: substitute this many hours of "deploy overdue" for the
          real measurement. Used by E-7 observation steps 3-4 to prove both
          the fail and pass paths without touching prod.
        required: false
        default: ''

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER: palateful-prod
  SERVICE: palateful-api-prod
  # The grace window: how long a change that deploys a new image may sit on
  # main without reaching prod before this goes red. MEASURED, not round:
  #
  #   - The 11 deploy-triggering commits of the 2026-09-22..24 burst (the
  #     last burst before this was written) reached prod 22.8-48.1 min after
  #     landing on main, median 38.2 min — "reached" meaning terraform-prod
  #     finished, which is when services[0].taskDefinition moves. The slowest
  #     whole run, push to deploy-services done, was 55 min (35913849835).
  #   - ci.yml cancels in-progress runs on main, so deploy-triggering merges
  #     closer together than one pipeline (~45 min) defer every deploy to the
  #     burst's last push: the oldest commit then waits burst length + ~50 min.
  #
  # 3h is ~3.7x the slowest measured deploy: it absorbs a ~2h burst of
  # back-to-back merges, or one flaked job re-run by hand, without flapping.
  # A longer burst DOES go red, deliberately — prod really is that far behind
  # main, because the cancellations starved the deploy lane (cicancel1).
  #
  # Cost against the schedule: slots are 12h apart, so a merge is caught by
  # the first scheduled run that fires >3h after it — the very next run for
  # ~3/4 of merges, the one after for the rest. Raising this past ~6h starts
  # pushing detection to the second run for most merges; lowering it below
  # ~1h starts alerting on healthy in-flight deploys.
  MAX_OVERDUE_HOURS: 3
  # Must match ci.yml's NODE_VERSION: the measure step runs nx through the
  # same tools/deploy-affected.sh that detect-changes runs.
  NODE_VERSION: '22'
  # The alert topic from alrt1 (terraform/modules/alerts). Subscriptions are
  # created by hand, outside Terraform, so no address appears in this repo,
  # in plan output, or in state — CI logs here are public.
  TOPIC_NAME: palateful-prod-alerts

jobs:
  check-freshness:
    # `environment: production` is required: the AWS secrets exist ONLY as
    # environment-scoped secrets (first dispatch run 30647079681 failed with
    # "Credentials could not be loaded" without it). Verified 2026-07-31 via
    # the API that this environment has NO protection rules — no reviewer
    # gate, no branch policy — so the scheduled run still fires unattended.
    # E-7 step 6 re-verifies that every morning; if a required-reviewer rule
    # is ever added to the environment, this check stalls waiting for
    # approval and can no longer detect an *unattended* freeze — either
    # exempt this job or move the AWS secrets to repo scope.
    environment: production
    runs-on: ubuntu-latest
    # Ceiling, not a target. Before 2026-11-24 the observed max was 22s
    # across 5 successful runs (7s, 10s, 12s, 13s, 22s) — two AWS reads and a
    # git log. The overdue predicate adds a yarn install and a handful of nx
    # queries (one when the backend is quiet). First run with it, dispatch
    # 45564742624 against real prod: 30s job — yarn install 9s (warm cache),
    # measure 7s. One sample; re-measure the max once a few runs exist.
    #
    # This one matters more than its runtime suggests. A detector that can
    # hang for six hours while nothing says so is not a detector: this job
    # exists to notice silence, and without a ceiling it can itself go
    # silent in exactly the way it was built to catch. 10m leaves several
    # minutes of headroom over a cold yarn install, so a slow AWS API or
    # registry cannot trip it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the deployed SHA may be months old (92 days when
          # this workstream opened), and the measure step walks main's
          # first-parent history from it to origin/main — a shallow clone
          # has neither.
          fetch-depth: 0

      # nx is how tools/deploy-affected.sh — shared with ci.yml's
      # detect-changes — decides what deploys. Same lockfile, same nx.
      #
      # Installed BEFORE the AWS credentials exist, as ci.yml's deploy-images
      # does: configure-aws-credentials exports the keys to every later step,
      # and a yarn install runs every dependency's install scripts. Prod keys
      # have no business in that environment. (nx itself still runs with
      # them in the measure step, as it already does in deploy-images.)
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      # `!cancelled()`, not the default success(): if the install above
      # fails, the measure step is skipped and the no-verdict notifier at the
      # bottom must still be able to reach SNS to say so. Without credentials
      # a registry outage would be a silent failure — the 52-run shape again.
      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ !cancelled() }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Measure how long prod has been overdue a deploy
        id: measure
        env:
          SYNTHETIC_OVERDUE_HOURS: ${{ inputs.synthetic-overdue-hours }}
        run: |
          set -euo pipefail

          # A VERDICT IS NOT THE SAME AS A FAILURE (G3, dfrcp1).
          #
          # This step still exits non-zero on a red verdict — `tools/
          # deploy-freshness-self-test.sh` extracts this body and asserts
          # exactly that, and the exit code IS the check. It RECORDS the
          # verdict first, so the notify step below (which runs on
          # `always()`, because this step has failed by then) can tell the
          # failure shapes apart:
          #
          #   verdict=stale   — measured prod, it is overdue a deploy. Notify.
          #   verdict=unknown — measured prod, the tag isn't a commit here.
          #                     Notify; unknown provenance is alarming.
          #   verdict=fresh   — measured prod, nothing is overdue (quiet, or
          #                     a deploy within its grace window). Silence.
          #   (no verdict)    — this step never got to a measurement. The
          #                     49 runs before 2026-09-20 all died in
          #                     configure-aws-credentials and measured
          #                     NOTHING, while looking exactly as red as a
          #                     real freeze. See the header note. An nx or
          #                     git failure below lands here too, never in
          #                     `fresh`.
          #
          # The credential-failure case cannot notify from here: publishing
          # to SNS needs those same credentials. That gap is absal1's job
          # (alert on the ABSENCE of an expected heartbeat). Do not "fix" this
          # by making the notify step run without a verdict; it would publish
          # nothing and hide the gap.

          # `tools/deploy-freshness-self-test.sh` extracts this step's body
          # and runs it OUTSIDE Actions, where $GITHUB_OUTPUT does not exist
          # and `set -u` turns a bare reference into a fatal error. Writing
          # through this helper keeps the step runnable in both places — and
          # keeps the self-test able to check the logic, which is the whole
          # reason that harness exists. (It also runs under macOS's bash 3.2
          # via the live check, hence no mapfile and no empty-array
          # expansions below.)
          emit() { printf '%s\n' "$@" >> "${GITHUB_OUTPUT:-/dev/null}"; }

          # THE FAMILY-SHORTCUT TRAP — do not "simplify" this to
          #   aws ecs describe-task-definition --task-definition palateful-api-prod
          # The family-name shortcut resolves to the family's newest ACTIVE
          # revision, i.e. what was most recently REGISTERED — not what ECS
          # is RUNNING. deploy-services (ci.yml) uses the shortcut correctly
          # because it runs immediately after terraform-prod writes that
          # revision; this check asks the opposite question. With the
          # shortcut, registering a new revision without deploying it would
          # make a frozen prod look fresh — the check would be green and
          # blind, masking exactly the failure it exists to catch. So:
          # describe-services -> services[0].taskDefinition (the revision
          # ARN actually in service) -> describe-task-definition on that ARN.
          running_td=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          echo "Running task definition: $running_td"

          image=$(aws ecs describe-task-definition --task-definition "$running_td" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          tag="${image##*:}"
          echo "Deployed image: $image"

          now=$(date +%s)
          grace_s=$(( MAX_OVERDUE_HOURS * 3600 ))
          # 5h 12m / 61d 3h — hours for anything inside two days.
          dur() { local h=$(( $1 / 3600 )); if [ "$h" -ge 48 ]; then echo "$(( h / 24 ))d $(( h % 24 ))h"; else echo "${h}h $(( ($1 % 3600) / 60 ))m"; fi; }

          if [ -n "${SYNTHETIC_OVERDUE_HOURS:-}" ]; then
            case "$SYNTHETIC_OVERDUE_HOURS" in
              *[!0-9]*) echo "::error::synthetic-overdue-hours must be a whole number of hours, got '$SYNTHETIC_OVERDUE_HOURS'."; exit 1 ;;
            esac
            echo "::warning::SYNTHETIC overdue of ${SYNTHETIC_OVERDUE_HOURS}h substituted for the real measurement (test run)."
            overdue_s=$(( SYNTHETIC_OVERDUE_HOURS * 3600 ))
            if [ "$overdue_s" -gt "$grace_s" ]; then overdue=true; else overdue=false; fi
            why="SYNTHETIC test value of ${SYNTHETIC_OVERDUE_HOURS}h, substituted for the measurement — this says nothing about prod."
          else
            # Image tags are pinned to the git SHA by resolve-tags (ci.yml),
            # so the tag IS the commit prod was built from. A tag that is not
            # a commit here means unknown provenance — itself alarming, so fail.
            if ! git cat-file -e "${tag}^{commit}" 2>/dev/null; then
              echo "::error::Deployed tag '$tag' is not a commit in this repository — cannot place the deployment on main."
              emit "verdict=unknown" \
                   "detail=Deployed tag '${tag}' is not a commit in this repository — cannot place the deployment on main. Image: ${image}"
              exit 1
            fi
            echo "Deployed commit: $(git log -1 --format='%h %ci %s' "$tag")"
            # Informational only. Image age is NOT the verdict: a quiet
            # backend runs an old image correctly.
            echo "Image age: $(dur $(( now - $(git log -1 --format=%ct "$tag") ))) (not the verdict)"

            # origin/main, never HEAD: a workflow_dispatch from a branch checks
            # that branch out, and the branch is not what deploys.
            main_sha=$(git rev-parse --verify 'origin/main^{commit}')
            echo "main: $(git log -1 --format='%h %ci %s' "$main_sha")"
            if ! git merge-base --is-ancestor "$tag" "$main_sha"; then
              echo "::warning::Deployed commit ${tag} is not on main (a Force Deploy from a branch?). Measuring main's changes since their merge-base."
            fi

            # Main's first-parent history since the deployed commit, oldest
            # first, one "<sha> <committer-epoch>" per line. Committer time
            # of a GitHub merge is the merge time. For a pushed local commit
            # it is EARLIER than the push, which can only make this go red
            # sooner, never later — the safe direction for a freeze detector.
            hist=$(mktemp)
            git log --first-parent --reverse --format='%H %ct' "${tag}..${main_sha}" > "$hist"
            n=$(grep -c . "$hist" || true)
            nth() { sed -n "${1}p" "$hist" | cut -d' ' -f1; }
            nth_ct() { sed -n "${1}p" "$hist" | cut -d' ' -f2; }

            # Does (deployed commit .. $1) deploy a new image? Asked of the
            # SAME script ci.yml's detect-changes runs, so this cannot
            # disagree with what CI actually deploys. Prints yes|no.
            #
            # Fails rather than answering when nx cannot: an empty answer
            # would mean "nothing to deploy", i.e. green. Every caller
            # assigns the result on its own line so `set -e` (or the explicit
            # `|| return 1` inside a function) stops the step there.
            deploys() {
              local out
              out=$(bash tools/deploy-affected.sh "$tag" "$1") || return 1
              case "$out" in
                *'services_to_build=[]'*) echo no ;;
                *'services_to_build=["'*) echo yes ;;
                *) echo "::error::tools/deploy-affected.sh printed no services_to_build line" >&2; return 1 ;;
              esac
            }
            # Oldest index in [lo, hi] whose prefix deploys, given hi does.
            # Bisection assumes "deploys" only turns on as commits are added;
            # a later revert can break that, which can mis-NAME the oldest
            # commit in the message but cannot change the verdict — that is
            # decided by `deploys` on B alone, below.
            first_deploying() {
              local lo="$1" hi="$2" mid r
              while [ "$lo" -lt "$hi" ]; do
                mid=$(( (lo + hi) / 2 ))
                r=$(deploys "$(nth "$mid")") || return 1
                if [ "$r" = yes ]; then hi="$mid"; else lo=$(( mid + 1 )); fi
              done
              echo "$lo"
            }

            overdue=false
            overdue_s=0
            if [ "$n" -eq 0 ]; then
              why="prod runs main's tip — nothing to deploy."
            else
              tip=$(deploys "$main_sha")
              if [ "$tip" = no ]; then
                why="quiet: ${n} commit(s) on main since the deployed commit, and together they deploy no new image (tools/deploy-affected.sh). An old image is the correct image."
              else
                # B = main as it stood MAX_OVERDUE_HOURS ago: the newest
                # first-parent commit that landed before the cutoff. 0 when
                # every undeployed commit is younger than the grace window.
                b=$(awk -v cut=$(( now - grace_s )) '$2 < cut { b = NR } END { print b + 0 }' "$hist")
                at_b=no
                if [ "$b" -eq "$n" ]; then at_b="$tip"
                elif [ "$b" -gt 0 ]; then at_b=$(deploys "$(nth "$b")"); fi
                if [ "$at_b" = yes ]; then
                  overdue=true
                  i=$(first_deploying 1 "$b")
                else
                  i=$(first_deploying $(( b + 1 )) "$n")
                fi
                s_sha=$(nth "$i")
                s_ct=$(nth_ct "$i")
                overdue_s=$(( now - s_ct ))
                oldest="$(git log -1 --format='%h (%ci) "%s"' "$s_sha")"
                if [ "$overdue" = true ]; then
                  why="main has carried changes that deploy a new image for $(dur "$overdue_s") and prod still runs $(git log -1 --format='%h (%ci)' "$tag"). Oldest undeployed: ${oldest}. Find ci.yml's run for that push or the next one and read detect-changes -> deploy-images -> terraform-prod -> deploy-services, then the production environment's reviewer gate."
                else
                  why="a change that deploys a new image landed $(dur "$overdue_s") ago, inside the grace window — a deploy is presumably in flight. Goes red from $(date -u -d "@$(( s_ct + grace_s ))" '+%Y-%m-%dT%H:%MZ' 2>/dev/null || date -u -r "$(( s_ct + grace_s ))" '+%Y-%m-%dT%H:%MZ') if it still has not reached prod. Oldest undeployed: ${oldest}."
                fi
              fi
            fi
            rm -f "$hist"
          fi

          echo "Overdue: $(dur "$overdue_s"); grace: ${MAX_OVERDUE_HOURS}h."
          emit "overdue_hours=$(( overdue_s / 3600 ))"
          if [ "$overdue" = true ]; then
            echo "::error::Prod is overdue a deploy (grace ${MAX_OVERDUE_HOURS}h) — a deploy freeze is in progress: ${why}"
            emit "verdict=stale" \
                 "detail=Prod is overdue a deploy (grace ${MAX_OVERDUE_HOURS}h) — a deploy freeze is in progress: ${why}"
            exit 1
          fi
          echo "Prod is not overdue a deploy: ${why}"
          emit "verdict=fresh"

      # Publish the verdict BEFORE failing the job, so a red verdict reaches
      # a human instead of sitting in a run nobody opens. Guarded on a
      # verdict actually existing: see the no-verdict note above.
      - name: Notify on a red verdict
        if: always() && (steps.measure.outputs.verdict == 'stale' || steps.measure.outputs.verdict == 'unknown')
        env:
          VERDICT: ${{ steps.measure.outputs.verdict }}
          DETAIL: ${{ steps.measure.outputs.detail }}
        run: |
          set -euo pipefail

          # Look the ARN up by name rather than hardcoding it: the account
          # id is not secret, but it has no business being in a public repo
          # when one API call derives it. Topic: modules/alerts (alrt1).
          topic_arn=$(aws sns list-topics \
            --query "Topics[?ends_with(TopicArn, ':${TOPIC_NAME}')].TopicArn | [0]" \
            --output text)

          if [ -z "$topic_arn" ] || [ "$topic_arn" = "None" ]; then
            echo "::error::Alert topic '${TOPIC_NAME}' not found — the verdict below reached nobody."
            echo "$DETAIL"
            exit 1
          fi

          # Built with printf rather than a literal multi-line string: an
          # unindented continuation line inside `run: |` silently ends the
          # block and breaks the whole workflow file.
          message=$(printf '%s\n\nWorkflow run: %s/%s/actions/runs/%s\n\n%s\n' \
            "$DETAIL" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "This is a measured verdict about prod, not a CI failure: the check reached AWS, read the running task definition, and this is what it found.")

          aws sns publish \
            --topic-arn "$topic_arn" \
            --subject "palateful prod: deploy-freshness ${VERDICT}" \
            --message "$message" > /dev/null

          echo "Published '${VERDICT}' verdict to ${TOPIC_NAME}."


      # THE CHECK'S OWN DEATH HAS TO LEAVE GITHUB TOO.
      #
      # Leo has GitHub Actions email notifications switched OFF, deliberately
      # — too noisy across personal and work repos. So a red run in the
      # Actions UI is not a channel anyone reads, and this workflow's 52
      # consecutive silent failures prove it: they were visible the whole
      # time, to nobody.
      #
      # A red VERDICT is handled above. This handles the other shape: the
      # check died before forming one (AWS API error, IAM change, the ECS
      # service renamed, a bug in the step). Without this, that case is
      # visible only as a red square in a UI Leo does not open, which is
      # precisely how the original design failed.
      #
      # HONEST LIMIT: this cannot fire when the AWS CREDENTIALS themselves
      # failed, because publishing needs them — the single largest historical
      # bucket (49 of 52 runs died in configure-aws-credentials). Nothing
      # inside this workflow can close that; only absal1, alerting on the
      # ABSENCE of an expected heartbeat from outside, can. Do not read this
      # step as making absal1 optional. It narrows the blind spot from "any
      # failure" to "credential failure"; it does not remove it.
      - name: Notify when the check itself failed to reach a verdict
        if: failure() && steps.measure.outputs.verdict == ''
        run: |
          set -euo pipefail

          topic_arn=$(aws sns list-topics \
            --query "Topics[?ends_with(TopicArn, ':${TOPIC_NAME}')].TopicArn | [0]" \
            --output text) || {
              echo "::error::Could not even reach SNS — credentials are the likely cause. This failure reaches nobody; see absal1."
              exit 1
            }

          if [ -z "$topic_arn" ] || [ "$topic_arn" = "None" ]; then
            echo "::error::Alert topic '${TOPIC_NAME}' not found — this failure reached nobody."
            exit 1
          fi

          message=$(printf '%s\n\nWorkflow run: %s/%s/actions/runs/%s\n\n%s\n' \
            "deploy-freshness could not measure prod: the check failed before reaching a verdict. Prod's deploy freshness is UNKNOWN right now — this is not a report that prod is fine." \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "Until this is fixed, the deploy-freeze detector is not running. It failed silently for 52 consecutive runs once before.")

          aws sns publish \
            --topic-arn "$topic_arn" \
            --subject "palateful prod: deploy-freshness CHECK FAILED (no verdict)" \
            --message "$message" > /dev/null

          echo "Published a no-verdict failure notice to ${TOPIC_NAME}."
