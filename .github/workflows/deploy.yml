# Deployment workflow — requires manual approval before any infrastructure
# or image changes reach AWS.
#
# Triggered automatically when CI passes on main. All jobs use the
# "production" GitHub Environment, which must have a required reviewer
# configured under:
#   Settings → Environments → production → Required reviewers
#
# Uses NX affected detection to only build/deploy services that changed.
#
# Required GitHub Secrets (set under Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID       - IAM user key with ECR push + Terraform permissions
#   AWS_SECRET_ACCESS_KEY   - IAM user secret
#   AWS_ECR_ACCOUNT_URL     - ECR registry base URL (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com)
#
# AWS region is pinned to us-east-1 via the workflow env (not a secret — the
# value is public and matches terraform/*.tfvars).

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  AWS_REGION: us-east-1

jobs:
  # Gate: only proceed when CI passed
  ci-gate:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI passed — proceeding to deployment approval"

  # ─── Detect which services changed ───

  detect-changes:
    runs-on: ubuntu-latest
    needs: ci-gate
    outputs:
      api: ${{ steps.affected.outputs.api }}
      worker: ${{ steps.affected.outputs.worker }}
      migrator: ${{ steps.affected.outputs.migrator }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4
        id: set-shas

      - name: Determine affected projects
        id: affected
        run: |
          AFFECTED=$(npx nx show projects --affected --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }})
          echo "Affected projects: $AFFECTED"
          if echo "$AFFECTED" | grep -q "^api$"; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$AFFECTED" | grep -q "^worker$"; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$AFFECTED" | grep -q "^migrator$"; then
            echo "migrator=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrator=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Resolve image tags (new SHA for affected, current deployed for unchanged) ───

  resolve-tags:
    runs-on: ubuntu-latest
    needs: detect-changes
    outputs:
      api_tag: ${{ steps.tags.outputs.api_tag }}
      worker_tag: ${{ steps.tags.outputs.worker_tag }}
      migrator_tag: ${{ steps.tags.outputs.migrator_tag }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          API_AFFECTED: ${{ needs.detect-changes.outputs.api }}
          WORKER_AFFECTED: ${{ needs.detect-changes.outputs.worker }}
          MIGRATOR_AFFECTED: ${{ needs.detect-changes.outputs.migrator }}
        run: |
          get_current_tag() {
            aws ecs describe-task-definition \
              --task-definition "$1" \
              --query 'taskDefinition.containerDefinitions[0].image' \
              --output text | rev | cut -d: -f1 | rev
          }

          if [ "$API_AFFECTED" = "true" ]; then
            echo "api_tag=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "api_tag=$(get_current_tag palateful-api-prod)" >> "$GITHUB_OUTPUT"
          fi

          if [ "$WORKER_AFFECTED" = "true" ]; then
            echo "worker_tag=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "worker_tag=$(get_current_tag palateful-worker-prod)" >> "$GITHUB_OUTPUT"
          fi

          if [ "$MIGRATOR_AFFECTED" = "true" ]; then
            echo "migrator_tag=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "migrator_tag=$(get_current_tag palateful-migrator-prod)" >> "$GITHUB_OUTPUT"
          fi

  # ─── Dev Infrastructure ───

  terraform:
    runs-on: ubuntu-latest
    needs: ci-gate
    environment: production
    env:
      AWS_ECR_ACCOUNT_URL: ${{ secrets.AWS_ECR_ACCOUNT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init (dev)
        run: terraform init
        working-directory: terraform/environments/dev

      - name: Terraform plan (dev)
        run: terraform plan -no-color -input=false -var-file=../../development.tfvars
        working-directory: terraform/environments/dev

      - name: Terraform apply (dev)
        run: terraform apply -auto-approve -input=false -var-file=../../development.tfvars
        working-directory: terraform/environments/dev

  # ─── Build & Push Docker Images (affected only) ───

  deploy-images:
    runs-on: ubuntu-latest
    needs: [ci-gate, detect-changes]
    if: >-
      needs.detect-changes.outputs.api == 'true' ||
      needs.detect-changes.outputs.worker == 'true' ||
      needs.detect-changes.outputs.migrator == 'true'
    environment: production
    env:
      AWS_ECR_ACCOUNT_URL: ${{ secrets.AWS_ECR_ACCOUNT_URL }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        if: needs.detect-changes.outputs.api == 'true'
        run: npx nx run api:build:ci
        env:
          INPUT_PUSH: 'true'

      - name: Build and push Migrator
        if: needs.detect-changes.outputs.migrator == 'true'
        run: npx nx run migrator:build:ci
        env:
          INPUT_PUSH: 'true'

      - name: Build and push Worker
        if: needs.detect-changes.outputs.worker == 'true'
        run: npx nx run worker:build:ci
        env:
          INPUT_PUSH: 'true'

  # ─── Production Infrastructure ───

  terraform-prod:
    runs-on: ubuntu-latest
    needs: [ci-gate, resolve-tags]
    environment: production
    env:
      API_TAG: ${{ needs.resolve-tags.outputs.api_tag }}
      WORKER_TAG: ${{ needs.resolve-tags.outputs.worker_tag }}
      MIGRATOR_TAG: ${{ needs.resolve-tags.outputs.migrator_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init (prod)
        run: terraform init -backend-config=../../backend-prod.hcl
        working-directory: terraform/environments/prod

      - name: Terraform plan (prod)
        run: |
          terraform plan -no-color -input=false \
            -var "api_image_tag=$API_TAG" \
            -var "worker_image_tag=$WORKER_TAG" \
            -var "migrator_image_tag=$MIGRATOR_TAG"
        working-directory: terraform/environments/prod

      - name: Terraform apply (prod)
        run: |
          terraform apply -auto-approve -input=false \
            -var "api_image_tag=$API_TAG" \
            -var "worker_image_tag=$WORKER_TAG" \
            -var "migrator_image_tag=$MIGRATOR_TAG"
        working-directory: terraform/environments/prod

  # ─── Run Migrations (only when migrator affected) ───

  run-migrator:
    runs-on: ubuntu-latest
    needs: [terraform-prod, deploy-images, detect-changes]
    if: >-
      always() &&
      needs.terraform-prod.result == 'success' &&
      (needs.deploy-images.result == 'success' || needs.deploy-images.result == 'skipped') &&
      needs.detect-changes.outputs.migrator == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Terraform outputs
        id: tf
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend-config=../../backend-prod.hcl
          echo "subnets=$(terraform output -json public_subnet_ids | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "sg=$(terraform output -raw ecs_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"

      - name: Run migrator task
        id: migrator
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ steps.tf.outputs.cluster }} \
            --task-definition palateful-migrator-prod \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.tf.outputs.subnets }}],securityGroups=[${{ steps.tf.outputs.sg }}],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Migrator task started: $TASK_ARN"

      - name: Wait for migrator to complete
        run: |
          aws ecs wait tasks-stopped \
            --cluster ${{ steps.tf.outputs.cluster }} \
            --tasks ${{ steps.migrator.outputs.task_arn }}
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ steps.tf.outputs.cluster }} \
            --tasks ${{ steps.migrator.outputs.task_arn }} \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migrator failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Migrator completed successfully"

  # ─── Deploy ECS Services (affected only) ───

  deploy-services:
    runs-on: ubuntu-latest
    needs: [run-migrator, detect-changes]
    if: >-
      always() &&
      (needs.run-migrator.result == 'success' || needs.run-migrator.result == 'skipped') &&
      (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.worker == 'true')
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment - API
        if: needs.detect-changes.outputs.api == 'true'
        run: |
          aws ecs update-service --cluster palateful-prod --service palateful-api-prod --force-new-deployment
          echo "API deployment triggered"

      - name: Force new deployment - Worker
        if: needs.detect-changes.outputs.worker == 'true'
        run: |
          aws ecs update-service --cluster palateful-prod --service palateful-worker-prod --force-new-deployment
          echo "Worker deployment triggered"
