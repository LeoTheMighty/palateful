# CI/CD Pipeline for Palateful
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID       - AWS IAM access key for ECR push and Terraform
#   AWS_SECRET_ACCESS_KEY   - AWS IAM secret key
#   AWS_ECR_ACCOUNT_URL     - ECR registry URL (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com)
#   AWS_REGION              - AWS region (e.g., us-east-1)
#
# Jobs:
#   setup          - Install dependencies, cache workspace (PR + push)
#   lint           - Python ruff lint via NX affected (PR + push)
#   test           - Python pytest via NX affected with PostgreSQL (PR + push)
#   check-models   - Verify SQLAlchemy models match Alembic migrations (PR + push)
#   flutter-test   - Flutter analyze + test (PR + push)
#   terraform      - Terraform validate + fmt check + plan (PR + push)
#   deploy-images  - Docker build + ECR push for api/migrator/worker (push to main only)

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      nx_base: ${{ steps.set-shas.outputs.base }}
      nx_head: ${{ steps.set-shas.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'libraries/utils/pyproject.toml', 'libraries/test-helper/pyproject.toml', 'libraries/agent/pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install Python dependencies
        run: |
          poetry install --with dev
          poetry run pip uninstall utils test-helper agent -y 2>/dev/null || true
          poetry install

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4
        id: set-shas

      - name: Save workspace
        uses: actions/cache/save@v4
        with:
          path: |
            .
            !.git
          key: workspace-${{ github.sha }}-${{ github.run_id }}

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            .
            !.git
          key: workspace-${{ github.sha }}-${{ github.run_id }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Run lint
        run: npx nx affected --base=${{ needs.setup.outputs.nx_base }} --head=${{ needs.setup.outputs.nx_head }} -t lint --parallel=3

  test:
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            .
            !.git
          key: workspace-${{ github.sha }}-${{ github.run_id }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Install Python dependencies
        run: |
          poetry install --with dev
          poetry run pip uninstall utils test-helper agent -y 2>/dev/null || true
          poetry install

      - name: Activate root virtualenv
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> $GITHUB_ENV

      - name: Run migrations
        run: npx nx run migrator:migrate-test

      - name: Run tests
        run: npx nx affected --base=${{ needs.setup.outputs.nx_base }} --head=${{ needs.setup.outputs.nx_head }} -t test --parallel=3 --exclude=e2e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: ignore

  check-models:
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: true  # Pre-existing model/migration drift; tracked separately
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            .
            !.git
          key: workspace-${{ github.sha }}-${{ github.run_id }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Check models match migrations
        run: npx nx run migrator:check-models

  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        working-directory: app
        run: |
          # Write dummy env values so assert() guards don't fire in tests
          cat > .env << 'EOF'
          API_BASE_URL=http://localhost:8000
          AUTH0_DOMAIN=test.palateful.us.auth0.com
          AUTH0_CLIENT_ID=test-client-id
          AUTH0_AUDIENCE=https://api.palateful.app
          EOF
          flutter pub get

      - name: Analyze
        working-directory: app
        # --no-fatal-warnings: only fail on errors (type errors, undefined names, etc.).
        # Warnings (unused private methods, dead params) are shown but don't block CI.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      # fmt and validate are purely offline — no AWS credentials needed.
      # Terraform plan and apply live in the deploy workflow (deploy.yml)
      # behind a manual approval gate.
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: terraform/environments/dev

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform/environments/dev

  # Image builds and deploys live in deploy.yml behind a manual approval gate.
  # See .github/workflows/deploy.yml.
