# CI & Deploy for Palateful
#
# Single workflow: runs on every PR and push to main. Deployment jobs are
# gated so they only run on `push` to `main` AND only after every CI
# quality gate (lint, test, check-models, flutter-test, terraform) has
# completed. Running both in one workflow gives a unified graph view.
#
# Production safety: every deploy-touching job sets `environment: production`,
# so GitHub's required-reviewer gate on that environment applies — nothing
# reaches AWS without approval.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID       - AWS IAM access key for ECR push and Terraform
#   AWS_SECRET_ACCESS_KEY   - AWS IAM secret key
#   AWS_ECR_ACCOUNT_URL     - ECR registry URL (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com)
#   CLOUDFLARE_API_TOKEN    - Cloudflare API token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID   - Cloudflare account ID (hosts the `palateful` Pages project)
#
# AWS region is pinned to us-east-1 via workflow env (not a secret — the
# value is public and matches terraform/*.tfvars).
#
# Jobs:
#   setup           - Install dependencies, cache workspace
#   lint            - Python ruff lint via NX affected
#   test            - Python pytest via NX affected with PostgreSQL
#   check-models    - SQLAlchemy ↔ Alembic drift check (continue-on-error)
#   flutter-test    - Flutter analyze + test
#   terraform       - Terraform fmt + validate (offline — no AWS creds)
#
#   === Deploy (main push only, after every CI job above) ===
#   detect-changes  - Which services are NX-affected
#   deploy-web      - Flutter web → Cloudflare Pages (palateful.app); runs in
#                     parallel with detect-changes — web is independent of
#                     the ECS image/terraform pipeline.
#   resolve-tags    - New SHA for affected, current deployed tag for unchanged
#   deploy-images   - Build + push Docker images for affected services
#   terraform-prod  - Apply prod infra with resolved image tags
#   run-migrator    - Run Alembic migrations (only when migrator affected)
#   deploy-services - Force ECS deployments for affected api/worker
#
# Note: dev infra lives in terraform/environments/dev and uses local state —
# it's managed from a developer's laptop, not CI.

name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'
  AWS_REGION: us-east-1
  # Terraform caches provider plugins here; we persist the dir across runs.
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      nx_base: ${{ steps.set-shas.outputs.base }}
      nx_head: ${{ steps.set-shas.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'libraries/utils/pyproject.toml', 'libraries/test-helper/pyproject.toml', 'libraries/agent/pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install Python dependencies
        run: |
          poetry install --with dev
          poetry run pip uninstall utils test-helper agent -y 2>/dev/null || true
          poetry install

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4
        id: set-shas

      - name: Save workspace
        uses: actions/cache/save@v4
        with:
          path: |
            .
            !.git
          key: workspace-${{ github.sha }}-${{ github.run_id }}

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            .
            !.git
          key: workspace-${{ github.sha }}-${{ github.run_id }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          poetry install --with dev
          poetry run pip uninstall utils test-helper agent -y 2>/dev/null || true
          poetry install

      - name: Run lint
        run: npx nx affected --base=${{ needs.setup.outputs.nx_base }} --head=${{ needs.setup.outputs.nx_head }} -t lint --parallel=3

  test:
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            .
            !.git
          key: workspace-${{ github.sha }}-${{ github.run_id }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          poetry install --with dev
          poetry run pip uninstall utils test-helper agent -y 2>/dev/null || true
          poetry install

      - name: Activate root virtualenv
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> $GITHUB_ENV

      - name: Install migrator dependencies
        run: npx nx run migrator:install

      - name: Run migrations
        run: npx nx run migrator:migrate-test

      - name: Run tests
        run: npx nx affected --base=${{ needs.setup.outputs.nx_base }} --head=${{ needs.setup.outputs.nx_head }} -t test --parallel=3 --exclude=e2e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: ignore

  check-models:
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: true  # Pre-existing model/migration drift; tracked separately
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            .
            !.git
          key: workspace-${{ github.sha }}-${{ github.run_id }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          poetry install --with dev
          poetry run pip uninstall utils test-helper agent -y 2>/dev/null || true
          poetry install

      # migrator:check-models depends on migrate-test, which runs `poetry run
      # alembic` inside services/migrator — that needs the migrator's own
      # per-service venv populated (alembic isn't in the root venv).
      - name: Install migrator dependencies
        run: npx nx run migrator:install

      - name: Check models match migrations
        run: npx nx run migrator:check-models

  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep channel + version in sync with .github/workflows/mobile-builds.yml
      # so CI doesn't pass on a Flutter version different from the one that
      # ships the AAB. Bumping Flutter means updating both files in one PR.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        working-directory: app
        run: |
          # Write dummy env values so assert() guards don't fire in tests
          cat > .env << 'EOF'
          API_BASE_URL=http://localhost:8000
          AUTH0_DOMAIN=test.palateful.us.auth0.com
          AUTH0_CLIENT_ID=test-client-id
          AUTH0_AUDIENCE=https://api.palateful.app
          EOF
          flutter pub get

      - name: Analyze
        working-directory: app
        # --no-fatal-warnings: only fail on errors (type errors, undefined names, etc.).
        # Warnings (unused private methods, dead params) are shown but don't block CI.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: No silent catches (rp-5 grep guard)
        run: bash tools/no-silent-catch-check.sh

      - name: No cook-mode chat references (cmrc-2 grep guard)
        run: bash tools/no-cook-chat-check.sh

      - name: No direct Image.network (ffm-11 grep guard)
        run: bash tools/image-network-check.sh

      - name: No direct getRecipeBooks() (ffm-1 grep guard)
        run: bash tools/no-direct-get-recipe-books-check.sh

      - name: Test
        working-directory: app
        run: flutter test

      # ─── ptd-4.5 / ptd-5 / ptd-8 — perf audit guards ─────────────────
      #
      # Order of execution:
      #   1. no-perf-budget-waiver-check — fast (<100 ms).
      #      Any budget entry > 1 without a matching waiver fails here.
      #   2. perf-audit-self-test — fast (<100 ms). Proves the
      #      assert-logic in perf-audit-diff.py still detects a
      #      synthetic regression.
      #   3. bin/perf-audit --assert — ~2 min. Runs the 9 per-screen
      #      integration tests, compares observed vs tools/perf-budgets.yaml.
      #
      # Warn-mode until 2026-05-07 (14-day grace window per epic
      # Locked Decision): PERF_AUDIT_STRICT unset → violations print
      # to the job summary but don't fail CI. Flip to strict mode by
      # setting `PERF_AUDIT_STRICT: '1'` on the step below after that
      # date. Keep this comment updated on the flip PR.
      - name: No perf-budget waivers missing (ptd-4.5)
        run: bash tools/no-perf-budget-waiver-check.sh

      - name: Perf audit self-test (ptd-8)
        run: bash tools/perf-audit-self-test.sh

      - name: Perf audit — assert per-screen budgets (ptd-4 / ptd-5)
        # Warn-mode: PERF_AUDIT_STRICT unset. Flip to '1' after
        # 2026-05-07. See the block comment above.
        #
        # Retry once on flake — flutter-tester occasionally hiccups
        # on cold boot. Tees the per-screen diff table into the
        # GitHub job summary regardless of outcome.
        run: |
          set +e
          {
            bash bin/perf-audit --assert \
              || bash bin/perf-audit --assert
          } | tee perf-audit.out
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "## Perf audit"
            echo '```'
            cat perf-audit.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$rc"

  # ptd-5 — `perf-budget-change` label auto-applied when the budget
  # yaml or waiver file is in the diff. Gives PR reviewers a fourth
  # independent cue that a budget raise is in flight (yaml diff,
  # waiver line, PR description rationale, this label).
  perf-budget-label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Create TF plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # fmt and validate are purely offline — no AWS credentials needed.
      # Plan/apply against AWS live in the terraform-dev / terraform-prod
      # deploy jobs below.
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: terraform/environments/dev

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform/environments/dev

  # ═══════════════════════════════════════════════════════════════════════
  # Deployment — gated on CI passing AND push to main
  # ═══════════════════════════════════════════════════════════════════════

  deploy-web:
    # Flutter web → Cloudflare Pages (palateful.app). Independent of the ECS
    # pipeline, so it runs in parallel with detect-changes. `.env.prod` is
    # gitignored — we materialize it inline from the known public values
    # (client IDs and public URLs end up in the JS bundle anyway, so they
    # don't warrant secret storage). Only CLOUDFLARE_* are true secrets.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [setup, lint, test, check-models, flutter-test, terraform]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Write prod env file
        working-directory: app
        run: |
          cat > .env.prod << 'EOF'
          API_BASE_URL=https://api.palateful.app
          AUTH0_DOMAIN=auth.palateful.app
          AUTH0_CLIENT_ID=Kge8bTdbfZ9rVQdCcTxDZLsF2YJ2I2Mc
          AUTH0_AUDIENCE=https://api.palateful.app
          EOF
          # flutter_dotenv requires the default asset to exist too (declared
          # in pubspec.yaml assets). Keep it empty — prod build reads .env.prod.
          touch .env

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Flutter web (prod)
        working-directory: app
        run: flutter build web --release --dart-define=ENV=prod

      - name: Deploy to Cloudflare Pages
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy build/web --project-name palateful --branch=main --commit-dirty=true

      - name: Verify /privacy is live (retry on propagation)
        # Play Console + App Store reviewers hit this URL during review.
        # A silent 404 would block the app from shipping, so we fail the
        # deploy job immediately if the privacy page isn't reachable.
        # Retry loop tolerates Cloudflare's edge-propagation lag.
        run: |
          URL="https://palateful.app/privacy"
          for attempt in 1 2 3; do
            echo "Attempt $attempt: curl -sSfLI $URL"
            FINAL=$(curl -sSfLI -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$FINAL" = "200" ]; then
              echo "✓ Privacy page returned 200 on attempt $attempt"
              exit 0
            fi
            echo "Got $FINAL, sleeping 10s..."
            sleep 10
          done
          echo "✗ Privacy page failed to return 200 after 3 attempts"
          exit 1

      - name: Emit privacy URL notice
        run: echo "::notice title=Privacy Policy URL::https://palateful.app/privacy is live"

  detect-changes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [setup, lint, test, check-models, flutter-test, terraform]
    outputs:
      api: ${{ steps.affected.outputs.api }}
      worker: ${{ steps.affected.outputs.worker }}
      migrator: ${{ steps.affected.outputs.migrator }}
      parser: ${{ steps.affected.outputs.parser }}
      # JSON array of affected services — fed into the deploy-images matrix
      # so each image builds on its own runner in parallel.
      services_to_build: ${{ steps.affected.outputs.services_to_build }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            .
            !.git
          key: workspace-${{ github.sha }}-${{ github.run_id }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Determine affected projects
        id: affected
        run: |
          AFFECTED=$(npx nx show projects --affected --base=${{ needs.setup.outputs.nx_base }} --head=${{ needs.setup.outputs.nx_head }})
          echo "Affected projects: $AFFECTED"
          if echo "$AFFECTED" | grep -q "^api$"; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$AFFECTED" | grep -q "^worker$"; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$AFFECTED" | grep -q "^migrator$"; then
            echo "migrator=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrator=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$AFFECTED" | grep -q "^parser$"; then
            echo "parser=true" >> "$GITHUB_OUTPUT"
          else
            echo "parser=false" >> "$GITHUB_OUTPUT"
          fi

          # Compose a JSON array of just the services that actually need to
          # be built. Empty array = deploy-images matrix skips entirely.
          services=()
          for s in api worker migrator parser; do
            if echo "$AFFECTED" | grep -q "^$s\$"; then
              services+=("\"$s\"")
            fi
          done
          printf 'services_to_build=[%s]\n' "$(IFS=,; echo "${services[*]}")" >> "$GITHUB_OUTPUT"

  resolve-tags:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: detect-changes
    environment: production
    outputs:
      api_tag: ${{ steps.tags.outputs.api_tag }}
      worker_tag: ${{ steps.tags.outputs.worker_tag }}
      migrator_tag: ${{ steps.tags.outputs.migrator_tag }}
      parser_tag: ${{ steps.tags.outputs.parser_tag }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.sha }}
          API_AFFECTED: ${{ needs.detect-changes.outputs.api }}
          WORKER_AFFECTED: ${{ needs.detect-changes.outputs.worker }}
          MIGRATOR_AFFECTED: ${{ needs.detect-changes.outputs.migrator }}
          PARSER_AFFECTED: ${{ needs.detect-changes.outputs.parser }}
        run: |
          get_ecs_tag() {
            aws ecs describe-task-definition \
              --task-definition "$1" \
              --query 'taskDefinition.containerDefinitions[0].image' \
              --output text | rev | cut -d: -f1 | rev
          }

          get_batch_tag() {
            # Parser runs on AWS Batch, not ECS — read current deployed tag
            # from the job definition's container image.
            aws batch describe-job-definitions \
              --job-definition-name "$1" \
              --status ACTIVE \
              --query 'reverse(sort_by(jobDefinitions, &revision))[0].containerProperties.image' \
              --output text | rev | cut -d: -f1 | rev
          }

          if [ "$API_AFFECTED" = "true" ]; then
            echo "api_tag=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "api_tag=$(get_ecs_tag palateful-api-prod)" >> "$GITHUB_OUTPUT"
          fi

          if [ "$WORKER_AFFECTED" = "true" ]; then
            echo "worker_tag=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "worker_tag=$(get_ecs_tag palateful-worker-prod)" >> "$GITHUB_OUTPUT"
          fi

          if [ "$MIGRATOR_AFFECTED" = "true" ]; then
            echo "migrator_tag=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "migrator_tag=$(get_ecs_tag palateful-migrator-prod)" >> "$GITHUB_OUTPUT"
          fi

          if [ "$PARSER_AFFECTED" = "true" ]; then
            echo "parser_tag=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "parser_tag=$(get_batch_tag palateful-parser-job-prod)" >> "$GITHUB_OUTPUT"
          fi

  # Dev infra is managed locally — terraform/environments/dev uses local state
  # (backend "s3" block in main.tf is intentionally commented out). CI only
  # manages prod infra via terraform-prod below.

  deploy-images:
    runs-on: ubuntu-latest
    needs: detect-changes
    # Skip quietly when nothing is affected — GHA errors out on an empty
    # matrix ("Matrix vector 'service' does not contain any values"), so
    # we short-circuit at the job level instead of letting it explode.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.detect-changes.outputs.services_to_build != '[]'
    environment: production
    # Parallel fan-out: one runner per affected service.
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services_to_build) }}
    env:
      AWS_ECR_ACCOUNT_URL: ${{ secrets.AWS_ECR_ACCOUNT_URL }}
      IMAGE_TAG: ${{ github.sha }}
      # @nx-tools/container-metadata reads the token via core.getInput('github-token'),
      # which maps to env var INPUT_GITHUB_TOKEN. GITHUB_TOKEN alone isn't picked up.
      INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        run: npx nx run ${{ matrix.service }}:build:ci
        env:
          INPUT_PUSH: 'true'

  terraform-prod:
    runs-on: ubuntu-latest
    # deploy-images must complete before terraform updates task defs —
    # otherwise terraform points ECS at an image tag that isn't in ECR yet,
    # ECS accumulates CannotPullContainerError attempts, and the deployment
    # circuit breaker rolls back to the old revision even after the image
    # eventually lands. Seen in run 24534239978.
    # deploy-images is skipped when no services were affected — that's valid;
    # terraform should still run against the existing (deployed) tags.
    needs: [resolve-tags, deploy-images]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.deploy-images.result == 'success' || needs.deploy-images.result == 'skipped')
    environment: production
    env:
      API_TAG: ${{ needs.resolve-tags.outputs.api_tag }}
      WORKER_TAG: ${{ needs.resolve-tags.outputs.worker_tag }}
      MIGRATOR_TAG: ${{ needs.resolve-tags.outputs.migrator_tag }}
      PARSER_TAG: ${{ needs.resolve-tags.outputs.parser_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Create TF plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init (prod)
        run: terraform init -backend-config=../../backend-prod.hcl
        working-directory: terraform/environments/prod

      - name: Terraform plan (prod)
        run: |
          terraform plan -no-color -input=false \
            -var "api_image_tag=$API_TAG" \
            -var "worker_image_tag=$WORKER_TAG" \
            -var "migrator_image_tag=$MIGRATOR_TAG" \
            -var "parser_image_tag=$PARSER_TAG"
        working-directory: terraform/environments/prod

      - name: Terraform apply (prod)
        run: |
          terraform apply -auto-approve -input=false \
            -var "api_image_tag=$API_TAG" \
            -var "worker_image_tag=$WORKER_TAG" \
            -var "migrator_image_tag=$MIGRATOR_TAG" \
            -var "parser_image_tag=$PARSER_TAG"
        working-directory: terraform/environments/prod

      # Parser's Batch job definition is versioned. Terraform always creates
      # the newest revision, but an out-of-band `register-job-definition`
      # call (debug session, manual rollback) could register a later one
      # that pins a digest — Batch submit-by-name then silently ignores
      # future `:SHA` pushes. Check that the highest ACTIVE revision we
      # just produced matches our PARSER_TAG. See docs/DEPLOYMENT.md#the-revision-trap
      - name: Verify parser job definition tracks deployed tag
        run: |
          ACTIVE_IMAGE=$(aws batch describe-job-definitions \
            --job-definition-name palateful-parser-job-prod \
            --status ACTIVE \
            --query 'reverse(sort_by(jobDefinitions, &revision))[0].containerProperties.image' \
            --output text)
          ACTIVE_TAG="${ACTIVE_IMAGE##*:}"
          if [ "$ACTIVE_TAG" != "$PARSER_TAG" ]; then
            echo "::error::Parser job-def drift: highest active revision is $ACTIVE_IMAGE but expected tag $PARSER_TAG. See docs/DEPLOYMENT.md#the-revision-trap"
            exit 1
          fi
          echo "Parser job-def points to expected tag: $PARSER_TAG"

  run-migrator:
    runs-on: ubuntu-latest
    needs: [terraform-prod, deploy-images, detect-changes]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.terraform-prod.result == 'success' &&
      (needs.deploy-images.result == 'success' || needs.deploy-images.result == 'skipped') &&
      needs.detect-changes.outputs.migrator == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Create TF plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Terraform outputs
        id: tf
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend-config=../../backend-prod.hcl
          echo "subnets=$(terraform output -json public_subnet_ids | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "sg=$(terraform output -raw ecs_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"

      - name: Run migrator task
        id: migrator
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ steps.tf.outputs.cluster }} \
            --task-definition palateful-migrator-prod \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.tf.outputs.subnets }}],securityGroups=[${{ steps.tf.outputs.sg }}],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Migrator task started: $TASK_ARN"

      - name: Wait for migrator to complete
        run: |
          aws ecs wait tasks-stopped \
            --cluster ${{ steps.tf.outputs.cluster }} \
            --tasks ${{ steps.migrator.outputs.task_arn }}
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ steps.tf.outputs.cluster }} \
            --tasks ${{ steps.migrator.outputs.task_arn }} \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migrator failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Migrator completed successfully"

  deploy-services:
    runs-on: ubuntu-latest
    needs: [run-migrator, terraform-prod, deploy-images, detect-changes]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.terraform-prod.result == 'success' &&
      (needs.deploy-images.result == 'success' || needs.deploy-images.result == 'skipped') &&
      (needs.run-migrator.result == 'success' || needs.run-migrator.result == 'skipped') &&
      (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.worker == 'true')
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployments (parallel)
        run: |
          # Roll API and Worker in parallel — each runs the update + poll
          # loop independently. services-stable returns on
          # runningCount==desiredCount, but rolloutState can stay IN_PROGRESS
          # for another ~90s while ECS closes its stability window, so we
          # poll until it settles (COMPLETED == success, FAILED == rollback).
          # deployments[0] is always PRIMARY; the [?status=='PRIMARY'] filter
          # sometimes returns [] mid-transition when taskSets flip.
          deploy_service() {
            local svc=$1
            aws ecs update-service --cluster palateful-prod --service "$svc" --force-new-deployment
            echo "$svc deployment triggered — waiting for stable..."
            aws ecs wait services-stable --cluster palateful-prod --services "$svc"
            local state=""
            for _ in $(seq 1 30); do
              state=$(aws ecs describe-services --cluster palateful-prod --services "$svc" \
                --query 'services[0].deployments[0].rolloutState' --output text)
              echo "$svc primary deployment rolloutState=$state"
              case "$state" in
                COMPLETED|FAILED) break ;;
              esac
              sleep 10
            done
            if [ "$state" != "COMPLETED" ]; then
              echo "::error::$svc deployment did NOT complete (rolloutState=$state). Deployment was likely rolled back by the circuit breaker. Check ECS service events and CloudWatch logs."
              aws ecs describe-services --cluster palateful-prod --services "$svc" \
                --query 'services[0].events[:10]' --output json
              return 1
            fi
          }

          pids=()
          if [ "${{ needs.detect-changes.outputs.api }}" = "true" ]; then
            deploy_service palateful-api-prod & pids+=($!)
          fi
          if [ "${{ needs.detect-changes.outputs.worker }}" = "true" ]; then
            deploy_service palateful-worker-prod & pids+=($!)
          fi
          rc=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then rc=1; fi
          done
          exit "$rc"
