name: devx-ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: devx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run lint --if-present

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      # `--if-present` matches the lint and coverage jobs below. Without it,
      # `npm test` exits 1 on any repo whose package.json has no `test`
      # script — which is every run of this workflow in palateful, including
      # pushes to main, since the real suites are pytest + flutter test in
      # ci.yml. See debug spec dvxci1.
      - run: npm run test --if-present

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run coverage --if-present
# <<< devx
