# Mobile App Store Build Pipeline — Palateful
#
# Triggers:
#   - Manual (workflow_dispatch)
#   - Push of version tags matching v*.*.* (e.g., v1.0.0)
#
# Required GitHub Secrets:
#
#   iOS:
#     MATCH_PASSWORD                       — Fastlane Match encryption password
#     MATCH_GIT_URL                        — Private git repo URL storing encrypted certs/profiles
#     APP_STORE_CONNECT_API_KEY_KEY_ID     — App Store Connect API key ID
#     APP_STORE_CONNECT_API_KEY_ISSUER_ID  — App Store Connect issuer ID
#     APP_STORE_CONNECT_API_KEY_KEY        — App Store Connect private key (.p8 file content)
#
#   Android:
#     ANDROID_KEYSTORE_BASE64          — Base64-encoded release keystore .jks
#                                        Generate: base64 -i release.jks | tr -d '\n' | pbcopy
#     ANDROID_STORE_PASSWORD           — Keystore store password
#     ANDROID_KEY_ALIAS                — Key alias within the keystore
#     ANDROID_KEY_PASSWORD             — Key password
#     PLAY_STORE_JSON_KEY              — Google Play service account JSON key (file content)
#     FIREBASE_SERVICE_ACCOUNT_JSON    — Firebase service account JSON (Crashlytics symbol
#                                        upload + Firebase Test Lab). Also serves as the
#                                        Play Store upload key if granted Play roles.

name: Mobile App Store Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

# Single source of truth for Flutter across iOS + Android + ci.yml flutter-test.
# Keep in sync with .github/workflows/ci.yml (flutter-test job).
env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: '3.32.0'

jobs:
  ios-build:
    name: iOS — Build & Upload to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install Flutter dependencies
        working-directory: app
        run: |
          touch .env
          flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: app/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: pod install

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app

      - name: Build and upload to TestFlight
        working-directory: app
        run: bundle exec fastlane ios beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}

  android-build:
    name: Android — Build & Upload to Play Store Internal
    runs-on: ubuntu-latest
    # Serialize duplicate tag pushes so two jobs never race for the same
    # Play Console version-code. Do NOT cancel-in-progress — killing a
    # half-complete upload can leave the track in a confusing state.
    concurrency:
      group: mobile-builds-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Exports GOOGLE_APPLICATION_CREDENTIALS pointing at the service-account
      # JSON so downstream steps can reach Google APIs. Consumed by:
      #   - the Crashlytics Gradle plugin during `gradle bundle` — auto-uploads
      #     mapping + native symbols when the extension flags are set (arh-5).
      #   - the Firebase Test Lab soft-smoke step (ach-4).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Flutter dependencies
        working-directory: app
        run: |
          # Dummy .env so assert() guards on required env vars don't fire during
          # analyze + test. Real values are not needed for static analysis or
          # the unit-test suite. Matches ci.yml's flutter-test job.
          cat > .env << 'EOF'
          API_BASE_URL=http://localhost:8000
          AUTH0_DOMAIN=test.palateful.us.auth0.com
          AUTH0_CLIENT_ID=test-client-id
          AUTH0_AUDIENCE=https://api.palateful.app
          EOF
          flutter pub get

      - name: Flutter analyze
        working-directory: app
        # Fail-fast gate: a broken main should not produce an AAB. Matches
        # ci.yml's flutter-test job flags — warnings surface but don't block.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter test
        working-directory: app
        run: flutter test

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app

      - name: Build and upload to Play Store
        working-directory: app
        run: bundle exec fastlane android internal
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

      # Brings the `gcloud` binary onto $PATH. Auth creds are inherited from
      # the google-github-actions/auth@v2 step earlier in the job.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: palateful

      # Soft-smoke Robo crawl on one Pixel-class emulator. Play Console's
      # Pre-Launch Report catches the same class of issues post-upload, but
      # burning a version code on each cycle is worse than running our own.
      # continue-on-error + `|| true` inside the script so a Test Lab infra
      # blip never blocks a healthy release — the upload has already happened.
      - name: Firebase Test Lab soft-smoke (Robo)
        continue-on-error: true
        working-directory: app
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "::warning::AAB not found at $AAB — skipping Test Lab."
            exit 0
          fi
          gcloud firebase test android run \
            --type=robo \
            --app "$AAB" \
            --device model=oriole,version=33,locale=en,orientation=portrait \
            --timeout 2m \
            --no-record-video \
            --project palateful \
            2>&1 | tee /tmp/testlab.log || true
          RESULT_URL=$(grep -oE 'https://console.firebase.google.com[^ ]+' /tmp/testlab.log | head -n1 || true)
          if [ -n "$RESULT_URL" ]; then
            echo "::notice title=Firebase Test Lab::Robo crawl results: $RESULT_URL"
          fi

      # Surface the Play Console link in the workflow summary so the operator
      # doesn't have to navigate there manually. Only runs on tag pushes; the
      # version is parsed from the tag ref (refs/tags/v1.2.3 → 1.2.3).
      - name: Emit Play Store summary link
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "::notice title=Play Store Internal Track::Build v${VERSION} uploaded. Review at https://play.google.com/console/u/0/developers"
