services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: palateful
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    # Uncomment to see all DB statements (helpful for debugging)
    # command: ["postgres", "-c", "log_statement=all"]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d palateful && pg_isready -U postgres -d test']
      interval: 10s
      timeout: 5s
      retries: 5

  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  migrator:
    build:
      context: .
      dockerfile: services/migrator/Dockerfile
    image: palateful-migrator
    command: ["upgrade", "head"]
    # command: ["downgrade", "-1"]
    container_name: palateful-migrator
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/palateful
    depends_on:
      db:
        condition: service_healthy

  migrator-test:
    build:
      context: .
      dockerfile: services/migrator/Dockerfile
    image: palateful-migrator
    command: ["upgrade", "head"]
    container_name: palateful-migrator-test
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/test
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: development
    image: palateful-api
    # restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - ./services/api/src:/services/api/src
      - ./libraries/utils/utils:/services/api/.venv/lib/python3.13/site-packages/utils
      - ~/.aws:/root/.aws:ro  # Mount AWS credentials for local dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/palateful
      # REDIS_URL: redis://redis:6379/0  # uncomment when redis service is re-enabled
      # Push notifications — empty by default triggers log-only mode.
      # Set either in .env or via shell env to deliver real pushes locally.
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    depends_on:
      db:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # flociswap1 (2026-09-27): replaces localstack/localstack with floci.
  #
  # WHY — not "the tag drifted"
  # ---------------------------
  # **LocalStack's community edition was sunset in March 2026.** The `:latest`
  # break localserve1 pinned around was the free tier being *withdrawn*. So
  # `localstack:3.8` is a fixed point *before* the sunset — not an
  # old-but-supported release — and will never receive a fix, security included.
  #
  # What we use it for is load-bearing: **SQS is the Celery broker**
  # (`CELERY_BROKER_URL: sqs://`, wired at `utils/services/celery.py:24,35`).
  # Without it the worker has no task queue and no background work runs at all.
  #
  # floci is **MIT** (github.com/floci-io/floci), needs no account or token, and
  # starts in ~0.02s (native Quarkus) against LocalStack's ~30s.
  #
  # PINNED EXACTLY. **A floating tag is a dependency you have not declared**,
  # and this file has been broken by one twice. Note `floci/floci` — the
  # `hectorvent/floci` reference a sibling repo pins says RELOCATED in its own
  # description, i.e. a stale reference one level above a floating tag.
  #
  # MEASURED, not assumed (2026-09-27)
  # ----------------------------------
  # * **kombu round-trips.** A real Celery-transport publish+consume succeeded
  #   through floci. This is the test that matters — "SQS answers a curl" does
  #   not imply kombu is happy, and kombu is what the worker uses.
  # * **It needs `AWS_ENDPOINT_URL` as an env var**, which this compose file
  #   already sets on `worker`. `broker_transport_options['endpoint_url']` alone
  #   did *not* redirect kombu — it silently went to real AWS and returned
  #   `InvalidClientTokenId`. **Identical against localstack:3.8**, so this is
  #   pre-existing behaviour and not a floci difference.
  # * **Persistence does not work at 1.0.11 and is not relied on here.**
  #   `FLOCI_STORAGE_MODE=disk` is *invalid* and was echoed back in the startup
  #   log (`Storage mode: disk`) while the StorageFactory said
  #   `Creating memory storage` — a config value echoed back is not a config
  #   value honoured. `persistent` is a valid value, is accepted, and **still**
  #   loses queues and S3 objects across a restart; the JSON files it names are
  #   never written. So memory mode is declared explicitly rather than pretended
  #   around. (mycase_hal's `memory` + `tmpfs` may be the only working mode
  #   rather than a deliberate choice.)
  # * **Ephemeral is acceptable for this use.** A broker losing queued tasks on
  #   a local restart is tolerable — Celery redeclares queues on connect. It
  #   would *not* be acceptable for S3, where the parser writes objects a later
  #   job reads; but **local S3 was never emulated here** (only `worker` gets
  #   `AWS_ENDPOINT_URL`; `parser` is profile-gated with no override and no
  #   credentials), so restoring parity means SQS and nothing else.
  localstack:
    image: floci/floci:1.0.11
    restart: unless-stopped
    ports:
      - '4566:4566'
    environment:
      FLOCI_STORAGE_MODE: memory
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      # floci ships **no `awslocal` and no `wget`** — the old
      # `awslocal sqs list-queues` probe cannot be reused, and a wget probe
      # exits 127, never passes, and since `worker` declares this a
      # *healthy*-dependency the worker would never start. That is the very
      # failure this swap removes, so it was worth testing rather than assuming.
      # `curl` and `bash` are present.
      #
      # There is also no health path: `/`, `/health` and `/_localstack/health`
      # all return 500, because floci serves an AWS API rather than a status
      # page. So the probe is a real SQS call — which is what the worker needs,
      # making a pass mean something. Proven both ways: exit 0 against floci,
      # exit 7 against a dead port.
      test:
        [
          'CMD-SHELL',
          'curl -fsS -X POST http://localhost:4566/ -d "Action=ListQueues&Version=2012-11-05" >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      target: development
    image: palateful-worker
    volumes:
      - ./services/worker/src:/services/worker/src
      - ./libraries/utils/utils:/services/worker/.venv/lib/python3.13/site-packages/utils
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/palateful
      CELERY_BROKER_URL: sqs://
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Push notifications — empty by default triggers log-only mode.
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  parser:
    profiles: ["local-parser"]
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    image: palateful-parser
    ports:
      - '8001:8001'
    volumes:
      - ./services/parser/src:/services/parser/src
    env_file:
      - .env
    environment:
      - DEVICE=cpu

  ngrok:
    image: ngrok/ngrok:latest
    # restart: unless-stopped
    command:
      - "http"
      - "http://api:8000"
      - "--log=stdout"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - '4040:4040'
    depends_on:
      - api

volumes:
  postgres_data:
  # redis_data:
