# Perf audit per-screen endpoint budgets — generated by
# `bin/perf-audit --capture`, hand-edited for intentional raises.
#
# Raising a budget requires:
#   1. Rationale in the PR description.
#   2. A matching line in tools/perf-budget-waivers.txt (format
#      screen:endpoint:rationale).
#   3. An `actions/labeler` auto-applied `perf-budget-change` label
#      (see ptd-5 CI step).
#
# `total` is the sum of `endpoints` for the screen; both are asserted
# against in `--assert` mode.
screens:
  activity_hub:
    total: 1
    endpoints:
      GET /v1/activities: 1
  books:
    total: 1
    endpoints:
      GET /v1/recipe-books: 1
  calendar:
    total: 1
    endpoints:
      GET /v1/meal-events: 1
  cook_mode_entry:
    total: 2
    endpoints:
      GET /v1/recipes/:id: 1
      GET /v1/users/me/notification-preferences: 1
  home:
    total: 5
    endpoints:
      GET /v1/cooking-logs: 1
      GET /v1/favorites: 1
      GET /v1/meal-events: 1
      GET /v1/meals: 1
      GET /v1/recipe-books: 1
  meals:
    total: 1
    endpoints:
      GET /v1/meals: 1
  profile:
    total: 1
    endpoints:
      GET /v1/users/me: 1
  recipe_detail:
    total: 1
    endpoints:
      GET /v1/recipes/:id: 1
  search:
    total: 1
    endpoints:
      GET /v1/search: 1
