[tool.coverage.run]
branch = true
source = [ "utils" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:', 'if catalyst:', 'pragma: no cover']
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report html:'../../coverage/libraries/utils/html' --cov-report xml:'../../coverage/libraries/utils/coverage.xml' --html='../../reports/libraries/utils/unittests/html/index.html' --junitxml='../../reports/libraries/utils/unittests/junit.xml'"

[tool.poetry]
name = "utils"
version = "1.0.0"
description = "Utility library for database operations and other data services in Palateful"
authors = [ ]
license = 'Proprietary'
readme = 'README.md'
exclude = [
    "utils/.pytest_cache",
    "utils/.coverage",
    "utils/__pycache__",
    "**/.pytest_cache/**",
    "**/*.pyc"
]

  [[tool.poetry.packages]]
  include = "utils"

  [tool.poetry.dependencies]
  python = "^3.13"
  sqlalchemy = "^2.0.44"
  celery = {extras = ["sqs"], version = "^5.5.3"}
  boto3 = "^1.40.61"
  openai = "^2.8.1"
  fastapi = "^0.120.2"
  python-dotenv = "^1.1.0"
  pillow = ">=11.3.0"
  starlette = "^0.49.1"
  pgvector = "^0.4"
  firebase-admin = "^6.5.0"
  # pim-5 (2026-04-21): redis.asyncio client for the Auth0 JWKS cache
  # relocated to ElastiCache. Fail-open semantics mean utils callers
  # never raise when Redis is unreachable — see
  # utils/services/redis_client.py.
  redis = "^5.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11"
pytest = "^8.0"
pytest-cov = "^6.0"
pytest-html = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"